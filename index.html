<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f6f8"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="飲食紀錄"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon-192.png"><title>我的飲食與運動紀錄 v6</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--text:#1f2937;--muted:#6b7280;--line:#e5e7eb;--accent:#111827;--soft:#eef2f7;--danger:#b91c1c}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",Arial,sans-serif;background:var(--bg);color:var(--text)}.app{max-width:900px;margin:auto;padding:16px 14px 96px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}.tabs{display:grid;grid-template-columns:repeat(7,1fr);position:fixed;left:0;right:0;bottom:0;background:#f5f6f8f2;padding:8px 5px calc(8px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}.tabbtn{border:0;background:transparent;padding:9px 3px;border-radius:12px;font-size:10px;color:var(--muted)}.tabbtn.active{background:var(--accent);color:#fff}.section{display:none}.section.active{display:block}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.full{grid-column:1/-1}label{display:block;color:var(--muted);font-size:13px;margin-bottom:5px}input,select,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff}textarea{min-height:78px}button{font:inherit}.primary,.secondary,.danger{border:0;border-radius:12px;padding:11px 14px}.primary{background:var(--accent);color:#fff}.secondary{background:var(--soft)}.danger{background:#fee2e2;color:var(--danger)}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.kpi{background:var(--soft);padding:10px;border-radius:12px}.kpi b{display:block;font-size:18px}.kpi span,.small,.note{font-size:12px;color:var(--muted)}.item{border-top:1px solid var(--line);padding:12px 0}.item:first-child{border-top:0}.itemtitle{font-weight:800}.photo{width:130px;height:95px;object-fit:cover;border-radius:12px;margin-top:8px}.photoPreview{display:none;width:100%;max-height:320px;object-fit:cover;border-radius:14px;margin-top:8px}.lock{position:fixed;inset:0;background:var(--bg);z-index:99;display:none;align-items:center;justify-content:center;padding:20px}.lock.show{display:flex}.lockbox{background:#fff;padding:20px;border-radius:20px;width:min(420px,100%);text-align:center}.pin{text-align:center;letter-spacing:8px;font-size:24px}.btnrow{display:flex;gap:8px;flex-wrap:wrap}.master-card{border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px}.master-title{font-weight:800}.master-meta{font-size:12px;color:var(--muted);margin-top:3px}.nutrition{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}.nutrition div{background:var(--soft);padding:7px;border-radius:10px;text-align:center}.nutrition b{display:block;font-size:13px}.nutrition span{font-size:9px;color:var(--muted)}.picker{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:80;display:none;align-items:flex-end}.picker.show{display:flex}.pickerbox{background:#fff;width:100%;max-height:85vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px}.empty{text-align:center;padding:22px;color:var(--muted)}@media(max-width:700px){.grid{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}}@media print{.tabs,.no-print,.lock{display:none!important}.app{padding:0}.section{display:none!important}#printArea{display:block!important}}
</style></head><body>
<div id="lock" class="lock"><div class="lockbox"><h2>🔒 已鎖定</h2><input id="unlockPin" class="pin" type="password" inputmode="numeric" maxlength="6" placeholder="••••"><div class="btnrow" style="justify-content:center;margin-top:10px"><button class="primary" onclick="unlockApp()">解鎖</button><button class="danger" onclick="forgotPin()">忘記 PIN</button></div></div></div><div id="foodPicker" class="picker"><div class="pickerbox"><div class="itemtitle">從食品主檔選擇</div><input id="pickerSearch" placeholder="搜尋品牌、商品或條碼" oninput="renderPicker()" style="margin-top:10px"><div id="pickerList"></div><button class="secondary" style="width:100%;margin-top:10px" onclick="closePicker()">關閉</button></div></div>
<div class="app"><div class="no-print"><h1 style="margin:0 0 4px">🍱 我的飲食與運動紀錄</h1><div class="note">本機儲存・可拍照・可列印</div></div>

<section id="today" class="section active"><div class="card"><div class="itemtitle" id="todayLabel"></div><div class="kpis" style="margin-top:10px"><div class="kpi"><b id="kcalToday">0</b><span>飲食 kcal</span></div><div class="kpi"><b id="proteinToday">0</b><span>蛋白質 g</span></div><div class="kpi"><b id="exerciseMin">0</b><span>運動分鐘</span></div><div class="kpi"><b id="exerciseKcal">0</b><span>運動消耗 kcal</span></div></div></div><div class="card"><div class="itemtitle">🔔 今日提醒</div><div id="reminder" class="note" style="margin-top:8px"></div></div><div class="card"><div class="itemtitle">今日飲食</div><div id="foodToday"></div></div><div class="card"><div class="itemtitle">今日運動</div><div id="exerciseToday"></div></div></section>

<section id="add" class="section"><div class="card"><div class="itemtitle">新增飲食</div><div class="btnrow" style="margin-top:10px"><button class="secondary" onclick="openPicker()">📚 從食品主檔選擇</button><button class="secondary" onclick="goTab('fooddb')">＋ 建立新食品</button></div><label style="margin-top:10px">餐點照片</label><input id="photoInput" type="file" accept="image/*" capture="environment" onchange="handlePhoto(event)"><img id="photoPreview" class="photoPreview"><div class="grid" style="margin-top:10px"><div><label>日期</label><input id="fDate" type="date"></div><div><label>時間</label><input id="fTime" type="time"></div><div><label>餐別</label><select id="fMeal"><option>早餐</option><option>午餐</option><option>下午點心</option><option>晚餐</option><option>宵夜</option><option>其他</option></select></div><div><label>食品主檔</label><input id="fMasterName" placeholder="未選擇" readonly></div><div><label>食物／餐點</label><input id="fFood"></div><div><label>吃了幾份</label><input id="fQty" value="1" inputmode="decimal" oninput="recalcMaster()"></div><div><label>單位</label><select id="fUnit"><option>份</option><option>g</option><option>ml</option><option>顆</option><option>片</option><option>碗</option><option>杯</option><option>個</option></select></div><div><label>熱量 kcal</label><input id="fKcal"></div><div><label>蛋白質 g</label><input id="fProtein"></div><div><label>碳水 g</label><input id="fCarb"></div><div><label>糖 g</label><input id="fSugar"></div><div><label>脂肪 g</label><input id="fFat"></div><div><label>纖維 g</label><input id="fFiber"></div><div><label>鈉 mg</label><input id="fSodium"></div><div class="full"><label>備註</label><textarea id="fNote"></textarea></div></div><button class="primary" style="margin-top:10px" onclick="saveFood()">儲存這一餐</button></div><div class="card"><div class="itemtitle">體重／體脂</div><div class="grid" style="margin-top:10px"><div><label>日期</label><input id="bDate" type="date"></div><div><label>體重 kg</label><input id="bWeight"></div><div><label>體脂 %</label><input id="bFat"></div><div><label>腰圍 cm</label><input id="bWaist"></div></div><button class="primary" style="margin-top:10px" onclick="saveBody()">儲存</button></div></section>

<section id="exercise" class="section"><div class="card"><div class="itemtitle">新增運動</div><div class="grid" style="margin-top:10px"><div><label>日期</label><input id="eDate" type="date"></div><div><label>類型</label><select id="eType" onchange="autoClass()"><option>快走</option><option>跑步</option><option>單車</option><option>橢圓機</option><option>游泳</option><option>傳統重量訓練</option><option>功能性肌力訓練</option><option>HIIT</option><option>其他</option></select></div><div><label>分類</label><select id="eClass"><option>有氧</option><option>無氧</option><option>混合</option></select></div><div><label>開始</label><input id="eStart" type="time"></div><div><label>結束</label><input id="eEnd" type="time" onchange="calcMin()"></div><div><label>分鐘</label><input id="eMinutes"></div><div><label>消耗 kcal</label><input id="eKcal"></div><div class="full"><label>備註</label><textarea id="eNote"></textarea></div></div><button class="primary" style="margin-top:10px" onclick="saveExercise()">儲存運動</button><div class="note" style="margin-top:10px">目前 PWA 不能直接讀 Apple Health / Apple Watch；未來原生 iPhone App 可用 HealthKit 匯入。</div></div><div class="card"><div class="itemtitle">運動紀錄</div><div id="exerciseList"></div></div></section>

<section id="fooddb" class="section"><div class="card"><div class="itemtitle">食品主檔</div><div class="note">第一次建立後，下次直接選商品就能帶入營養素。包裝標示優先於網路資料。</div>
<div class="btnrow" style="margin-top:10px">
  <button class="secondary" onclick="document.getElementById('barcodePhotoInput').click()">📷 拍條碼辨識</button>
  <button class="secondary" onclick="document.getElementById('barcodePhotoLibraryInput').click()">🖼️ 從圖庫選條碼</button>
</div>

<div class="btnrow" style="margin-top:10px">
  <button class="secondary" onclick="document.getElementById('pkgPhotoInput').click()">📷 拍商品外包裝</button>
  <button class="secondary" onclick="document.getElementById('pkgPhotoLibraryInput').click()">🖼️ 從圖庫選外包裝</button>
</div>

<div class="btnrow" style="margin-top:10px">
  <button class="secondary" onclick="document.getElementById('nutritionPhotoInput').click()">📷 拍營養標示</button>
  <button class="secondary" onclick="document.getElementById('nutritionPhotoLibraryInput').click()">🖼️ 從圖庫選營養標示</button>
</div>

<input id="barcodePhotoInput" type="file" accept="image/*" capture="environment" style="display:none" onchange="scanBarcodePhoto(event)">
<input id="barcodePhotoLibraryInput" type="file" accept="image/*" style="display:none" onchange="scanBarcodePhoto(event)">

<input id="pkgPhotoInput" type="file" accept="image/*" capture="environment" style="display:none" onchange="handleMasterPhoto(event,'package')">
<input id="pkgPhotoLibraryInput" type="file" accept="image/*" style="display:none" onchange="handleMasterPhoto(event,'package')">

<input id="nutritionPhotoInput" type="file" accept="image/*" capture="environment" style="display:none" onchange="handleMasterPhoto(event,'nutrition')">
<input id="nutritionPhotoLibraryInput" type="file" accept="image/*" style="display:none" onchange="handleMasterPhoto(event,'nutrition')">  
<img id="masterPhotoPreview" class="photoPreview"><div class="btnrow" style="margin-top:10px"><button class="secondary" onclick="shareMasterPhotoToAI()">傳給 ChatGPT 辨識</button><button class="secondary" onclick="pasteMasterAI()">貼上辨識結果</button></div><textarea id="masterAIText" placeholder="品牌：
品名：
條碼：
每份：
熱量： kcal
蛋白質： g
碳水： g
糖： g
脂肪： g
纖維： g
鈉： mg" style="margin-top:10px"></textarea><button class="primary" style="margin-top:8px" onclick="applyMasterAI()">套用辨識結果</button><div class="grid" style="margin-top:14px"><div><label>品牌</label><input id="mBrand"></div><div><label>商品名稱</label><input id="mName"></div><div><label>條碼</label><input id="mBarcode" inputmode="numeric"></div><div><label>每份重量/容量</label><input id="mServing" placeholder="例如 400 ml"></div><div><label>熱量 kcal</label><input id="mKcal"></div><div><label>蛋白質 g</label><input id="mProtein"></div><div><label>碳水 g</label><input id="mCarb"></div><div><label>糖 g</label><input id="mSugar"></div><div><label>脂肪 g</label><input id="mFat"></div><div><label>膳食纖維 g</label><input id="mFiber"></div><div><label>鈉 mg</label><input id="mSodium"></div><div><label>資料來源</label><select id="mSource"><option>包裝營養標示</option><option>品牌官網</option><option>網路資料</option><option>AI 辨識</option><option>手動輸入</option></select></div><div><label>最後確認日期</label><input id="mConfirmed" type="date"></div><div class="full"><label>備註</label><textarea id="mNote"></textarea></div></div><button class="primary" style="margin-top:10px" onclick="saveMaster()">儲存食品主檔</button></div><div class="card"><div class="itemtitle">已建立食品</div><input id="masterSearch" placeholder="搜尋品牌、商品或條碼" oninput="renderMasters()" style="margin-top:10px"><div id="masterList"></div></div></section>

<section id="history" class="section"><div class="card"><div class="itemtitle">歷史紀錄</div><div class="grid" style="margin-top:10px"><div><label>開始日期</label><input id="hStart" type="date"></div><div><label>結束日期</label><input id="hEnd" type="date"></div></div><div class="btnrow" style="margin-top:10px"><button class="primary" onclick="renderHistory()">查詢</button><button class="secondary" onclick="printHistory()">列印</button></div></div><div class="card"><div id="historyList"></div></div></section>

<section id="stats" class="section"><div class="card"><div class="itemtitle">統計</div><div class="kpis" style="margin-top:10px"><div class="kpi"><b id="statFoods">0</b><span>餐數</span></div><div class="kpi"><b id="statDays">0</b><span>飲食天數</span></div><div class="kpi"><b id="statEx">0</b><span>運動分鐘</span></div><div class="kpi"><b id="statBody">0</b><span>身體紀錄</span></div></div></div><div class="card"><div class="itemtitle">體重／體脂歷史</div><div id="bodyList"></div></div></section>

<section id="settings" class="section"><div class="card"><div class="itemtitle">智慧提醒</div><div class="grid" style="margin-top:10px"><div><label>每日熱量目標</label><input id="goalKcal"></div><div><label>每日蛋白質目標 g</label><input id="goalProtein"></div><div><label>接近目標提醒 %</label><input id="warnPercent"></div><div><label>晚間總結時間</label><input id="summaryTime" type="time"></div></div><button class="primary" style="margin-top:10px" onclick="saveSettings()">儲存設定</button></div>
<div class="card"><div class="itemtitle">🔒 本機 PIN 鎖</div><div class="grid" style="margin-top:10px"><div><label>4～6 位 PIN</label><input id="newPin" type="password" inputmode="numeric" maxlength="6"></div><div><label>離開幾分鐘後鎖定</label><input id="lockMinutes" value="5"></div></div><div class="btnrow" style="margin-top:10px"><button class="primary" onclick="setPin()">啟用／更新 PIN</button><button class="danger" onclick="disablePin()">停用 PIN</button></div></div>
<div class="card"><div class="itemtitle">備份</div><div class="btnrow" style="margin-top:10px"><button class="primary" onclick="exportBackup()">匯出 JSON</button><label class="secondary" style="padding:11px 14px;border-radius:12px">匯入 JSON<input type="file" accept=".json" style="display:none" onchange="importBackup(event)"></label></div></div></section>

<section id="printArea" class="section"><h2>飲食與運動紀錄</h2><div id="printContent"></div></section>
</div>
<nav class="tabs no-print"><button class="tabbtn active" data-tab="today" onclick="goTab('today')">今天</button><button class="tabbtn" data-tab="add" onclick="goTab('add')">飲食</button><button class="tabbtn" data-tab="exercise" onclick="goTab('exercise')">運動</button><button class="tabbtn" data-tab="fooddb" onclick="goTab('fooddb')">食品庫</button><button class="tabbtn" data-tab="history" onclick="goTab('history')">紀錄</button><button class="tabbtn" data-tab="stats" onclick="goTab('stats')">統計</button><button class="tabbtn" data-tab="settings" onclick="goTab('settings')">設定</button></nav>
<script>
const K='foodlog_v6';const D={foods:[],body:[],exercise:[],masters:[],settings:{goalKcal:'',goalProtein:'',warnPercent:'80',summaryTime:'20:30',pinHash:'',lockMinutes:'5',lastHidden:0}};let db=load(),photo=null,photoURL=null,selectedMasterId='',masterPhoto=null,masterPhotoKind='',masterPhotoURL=null;function load(){try{return {...D,...JSON.parse(localStorage.getItem(K)||'{}'),settings:{...D.settings,...(JSON.parse(localStorage.getItem(K)||'{}').settings||{})}}}catch{return JSON.parse(JSON.stringify(D))}}function save(){localStorage.setItem(K,JSON.stringify(db))}function p(n){return String(n).padStart(2,'0')}function dn(){let d=new Date();return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`}function tn(){let d=new Date();return `${p(d.getHours())}:${p(d.getMinutes())}`}function num(v){let x=parseFloat(v);return isFinite(x)?x:0}function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function goTab(id){document.querySelectorAll('.section').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.tabbtn').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelector(`[data-tab="${id}"]`)?.classList.add('active');if(id==='today')renderToday();if(id==='exercise')renderExercise();if(id==='fooddb')renderMasters();if(id==='history')renderHistory();if(id==='stats')renderStats();if(id==='settings')loadSettings()}
function pdb(){return new Promise((a,b)=>{let r=indexedDB.open('foodphotos',1);r.onupgradeneeded=e=>e.target.result.createObjectStore('p');r.onsuccess=e=>a(e.target.result);r.onerror=e=>b(e.target.error)})}async function putP(id,b){let d=await pdb();return new Promise((a,c)=>{let t=d.transaction('p','readwrite');t.objectStore('p').put(b,id);t.oncomplete=a;t.onerror=()=>c(t.error)})}async function getP(id){if(!id)return null;let d=await pdb();return new Promise((a,c)=>{let r=d.transaction('p').objectStore('p').get(id);r.onsuccess=()=>a(r.result||null);r.onerror=()=>c(r.error)})}
async function handlePhoto(e){photo=e.target.files[0];if(!photo)return;if(photoURL)URL.revokeObjectURL(photoURL);photoURL=URL.createObjectURL(photo);photoPreview.src=photoURL;photoPreview.style.display='block'}
async function saveFood(){if(!fFood.value.trim()){alert('請輸入食物／餐點');return}let photoId='';if(photo){photoId='p_'+uid();await putP(photoId,photo)}db.foods.push({id:uid(),date:fDate.value,time:fTime.value,meal:fMeal.value,masterId:selectedMasterId,food:fFood.value.trim(),qty:fQty.value,unit:fUnit.value,kcal:fKcal.value,protein:fProtein.value,carb:fCarb.value,sugar:fSugar.value,fat:fFat.value,fiber:fFiber.value,sodium:fSodium.value,note:fNote.value,photoId});save();selectedMasterId='';fMasterName.value='';fFood.value='';fQty.value='1';fKcal.value=fProtein.value=fCarb.value=fSugar.value=fFat.value=fFiber.value=fSodium.value=fNote.value='';photo=null;photoInput.value='';photoPreview.style.display='none';renderToday();alert('已儲存這一餐')}
async function foodHtml(x){let pic='';if(x.photoId){let b=await getP(x.photoId);if(b)pic=`<img class="photo" src="${URL.createObjectURL(b)}">`}return `<div class="item"><b>${esc(x.food)}</b><div class="small">${esc(x.meal)}・${esc(x.time)} ${x.qty?`・${esc(x.qty)} ${esc(x.unit)}`:''}</div>${pic}<div class="small">${esc(x.kcal||'—')} kcal・蛋白質 ${esc(x.protein||'—')} g・碳水 ${esc(x.carb||'—')} g・脂肪 ${esc(x.fat||'—')} g・糖 ${esc(x.sugar||'—')} g・鈉 ${esc(x.sodium||'—')} mg</div></div>`}
async function renderToday(){let d=dn(),f=db.foods.filter(x=>x.date===d),e=db.exercise.filter(x=>x.date===d);todayLabel.textContent=`今天 ${d}`;kcalToday.textContent=Math.round(f.reduce((a,b)=>a+num(b.kcal),0));proteinToday.textContent=f.reduce((a,b)=>a+num(b.protein),0).toFixed(1).replace('.0','');exerciseMin.textContent=Math.round(e.reduce((a,b)=>a+num(b.minutes),0));exerciseKcal.textContent=Math.round(e.reduce((a,b)=>a+num(b.kcal),0));foodToday.innerHTML=f.length?(await Promise.all(f.map(foodHtml))).join(''):'<div class="empty">今天還沒有飲食紀錄</div>';exerciseToday.innerHTML=e.length?e.map(exHtml).join(''):'<div class="empty">今天還沒有運動紀錄</div>';renderReminder()}
function exHtml(x){return `<div class="item"><b>${esc(x.type)}</b><div class="small">${esc(x.class)}・${esc(x.minutes)} 分鐘・${esc(x.kcal||'—')} kcal</div></div>`}function autoClass(){let t=eType.value;eClass.value=['快走','跑步','單車','橢圓機','游泳'].includes(t)?'有氧':['傳統重量訓練','功能性肌力訓練'].includes(t)?'無氧':'混合'}function calcMin(){if(!eStart.value||!eEnd.value)return;let [sh,sm]=eStart.value.split(':').map(Number),[eh,em]=eEnd.value.split(':').map(Number),m=(eh*60+em)-(sh*60+sm);if(m<0)m+=1440;eMinutes.value=m}function saveExercise(){db.exercise.push({id:uid(),date:eDate.value,type:eType.value,class:eClass.value,start:eStart.value,end:eEnd.value,minutes:eMinutes.value,kcal:eKcal.value,note:eNote.value});save();renderExercise();renderToday();alert('運動已儲存')}function renderExercise(){let a=[...db.exercise].sort((x,y)=>(y.date+y.start).localeCompare(x.date+x.start));exerciseList.innerHTML=a.length?a.map(x=>`<div class="item"><b>${x.date}｜${esc(x.type)}</b><div class="small">${esc(x.class)}・${esc(x.minutes)} 分鐘・${esc(x.kcal||'—')} kcal</div></div>`).join(''):'<div class="empty">尚無運動紀錄</div>'}

async function handleMasterPhoto(e,kind){const f=e.target.files[0];if(!f)return;masterPhoto=f;masterPhotoKind=kind;if(masterPhotoURL)URL.revokeObjectURL(masterPhotoURL);masterPhotoURL=URL.createObjectURL(f);masterPhotoPreview.src=masterPhotoURL;masterPhotoPreview.style.display='block'}
async function shareMasterPhotoToAI(){if(!masterPhoto){alert('請先拍商品外包裝或營養標示');return}const text=`請辨識這張${masterPhotoKind==='nutrition'?'營養標示':'商品外包裝'}照片，請只用以下格式回覆，不確定留白：\n品牌：\n品名：\n條碼：\n每份：\n熱量： kcal\n蛋白質： g\n碳水： g\n糖： g\n脂肪： g\n纖維： g\n鈉： mg`;try{if(navigator.share&&navigator.canShare&&navigator.canShare({files:[masterPhoto]})){await navigator.share({files:[masterPhoto],text,title:'食品營養辨識'})}else{await navigator.clipboard.writeText(text);alert('此瀏覽器無法直接分享照片，已複製辨識格式；請把照片和文字一起傳給 ChatGPT。')}}catch(e){}}
async function pasteMasterAI(){try{masterAIText.value=await navigator.clipboard.readText()}catch(e){alert('請長按文字框後選「貼上」')}}
function lineVal(t,k){const m=t.match(new RegExp('^'+k+'\\s*[:：]\\s*(.+)$','im'));return m?m[1].trim():''}function numVal(t,k){const v=lineVal(t,k),m=v.match(/[0-9]+(?:\\.[0-9]+)?/);return m?m[0]:''}
function applyMasterAI(){const t=masterAIText.value;mBrand.value=lineVal(t,'品牌');mName.value=lineVal(t,'品名')||lineVal(t,'商品名稱');mBarcode.value=lineVal(t,'條碼');mServing.value=lineVal(t,'每份');mKcal.value=numVal(t,'熱量');mProtein.value=numVal(t,'蛋白質');mCarb.value=numVal(t,'碳水')||numVal(t,'碳水化合物');mSugar.value=numVal(t,'糖');mFat.value=numVal(t,'脂肪');mFiber.value=numVal(t,'纖維')||numVal(t,'膳食纖維');mSodium.value=numVal(t,'鈉');mSource.value='AI 辨識';mConfirmed.value=dn();alert('已帶入可辨識欄位，請對照包裝確認後再儲存。')}
async function scanBarcodePhoto(e){const f=e.target.files[0];if(!f)return;masterPhoto=f;masterPhotoKind='barcode';if(masterPhotoURL)URL.revokeObjectURL(masterPhotoURL);masterPhotoURL=URL.createObjectURL(f);masterPhotoPreview.src=masterPhotoURL;masterPhotoPreview.style.display='block';if(!('BarcodeDetector'in window)){alert('這台 iPhone 的瀏覽器目前不支援網頁直接辨識條碼。可以把這張照片傳給 ChatGPT 辨識，或手動輸入條碼。');return}try{const det=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128']});const bmp=await createImageBitmap(f);const rs=await det.detect(bmp);if(rs.length){mBarcode.value=rs[0].rawValue;alert('已辨識條碼：'+rs[0].rawValue)}else alert('沒有辨識到條碼，請拍近一點或改手動輸入。')}catch(err){alert('條碼辨識失敗，可改傳給 ChatGPT 辨識。')}}
async function saveMaster(){if(!mName.value.trim()){alert('請輸入商品名稱');return}const bc=mBarcode.value.trim();if(bc&&db.masters.some(x=>x.barcode===bc)){alert('這個條碼已存在食品主檔');return}let photoId='';if(masterPhoto){photoId='m_'+uid();await putP(photoId,masterPhoto)}db.masters.push({id:uid(),brand:mBrand.value.trim(),name:mName.value.trim(),barcode:bc,serving:mServing.value.trim(),kcal:mKcal.value,protein:mProtein.value,carb:mCarb.value,sugar:mSugar.value,fat:mFat.value,fiber:mFiber.value,sodium:mSodium.value,source:mSource.value,confirmed:mConfirmed.value,note:mNote.value.trim(),photoId});save();clearMaster();renderMasters();alert('食品主檔已儲存')}
function clearMaster(){[mBrand,mName,mBarcode,mServing,mKcal,mProtein,mCarb,mSugar,mFat,mFiber,mSodium,mNote,masterAIText].forEach(x=>x.value='');mSource.value='包裝營養標示';mConfirmed.value=dn();masterPhoto=null;masterPhotoPreview.style.display='none'}
async function masterCard(x){let pic='';if(x.photoId){const b=await getP(x.photoId);if(b)pic=`<img class="photo" src="${URL.createObjectURL(b)}">`}return `<div class="master-card"><div class="master-title">${esc(x.brand?x.brand+' ':'')}${esc(x.name)}</div><div class="master-meta">${x.barcode?'條碼 '+esc(x.barcode)+'・':''}${esc(x.serving||'每份未填')}・${esc(x.source||'')}</div>${pic}<div class="nutrition"><div><b>${esc(x.kcal||'—')}</b><span>kcal</span></div><div><b>${esc(x.protein||'—')}</b><span>蛋白質 g</span></div><div><b>${esc(x.carb||'—')}</b><span>碳水 g</span></div><div><b>${esc(x.fat||'—')}</b><span>脂肪 g</span></div><div><b>${esc(x.sugar||'—')}</b><span>糖 g</span></div><div><b>${esc(x.fiber||'—')}</b><span>纖維 g</span></div><div><b>${esc(x.sodium||'—')}</b><span>鈉 mg</span></div></div><div class="btnrow" style="margin-top:8px"><button class="secondary" onclick="useMaster('${x.id}')">加入飲食</button><button class="danger" onclick="deleteMaster('${x.id}')">刪除</button></div></div>`}
async function renderMasters(){const q=(masterSearch?.value||'').trim().toLowerCase();const a=db.masters.filter(x=>!q||`${x.brand} ${x.name} ${x.barcode}`.toLowerCase().includes(q));masterList.innerHTML=a.length?(await Promise.all(a.map(masterCard))).join(''):'<div class="empty">尚未建立食品主檔</div>'}
function deleteMaster(id){if(!confirm('確定刪除這個食品主檔？'))return;db.masters=db.masters.filter(x=>x.id!==id);save();renderMasters()}
function openPicker(){pickerSearch.value='';foodPicker.classList.add('show');renderPicker()}function closePicker(){foodPicker.classList.remove('show')}
function renderPicker(){const q=pickerSearch.value.trim().toLowerCase(),a=db.masters.filter(x=>!q||`${x.brand} ${x.name} ${x.barcode}`.toLowerCase().includes(q));pickerList.innerHTML=a.length?a.map(x=>`<div class="master-card" onclick="useMaster('${x.id}')"><div class="master-title">${esc(x.brand?x.brand+' ':'')}${esc(x.name)}</div><div class="master-meta">${esc(x.serving||'')}・${esc(x.kcal||'—')} kcal/份</div></div>`).join(''):'<div class="empty">找不到食品</div>'}
function useMaster(id){const x=db.masters.find(v=>v.id===id);if(!x)return;selectedMasterId=id;fMasterName.value=(x.brand?x.brand+' ':'')+x.name;fFood.value=fMasterName.value;fQty.value='1';fUnit.value='份';recalcMaster();closePicker();goTab('add')}
function recalcMaster(){const x=db.masters.find(v=>v.id===selectedMasterId);if(!x)return;const q=num(fQty.value);fKcal.value=(num(x.kcal)*q).toFixed(1).replace('.0','');fProtein.value=(num(x.protein)*q).toFixed(1).replace('.0','');fCarb.value=(num(x.carb)*q).toFixed(1).replace('.0','');fSugar.value=(num(x.sugar)*q).toFixed(1).replace('.0','');fFat.value=(num(x.fat)*q).toFixed(1).replace('.0','');fFiber.value=(num(x.fiber)*q).toFixed(1).replace('.0','');fSodium.value=(num(x.sodium)*q).toFixed(1).replace('.0','')}

function saveBody(){if(!bWeight.value&&!bFat.value&&!bWaist.value){alert('至少輸入一項');return}let x=db.body.find(x=>x.date===bDate.value);if(x){x.weight=bWeight.value;x.fat=bFat.value;x.waist=bWaist.value}else db.body.push({id:uid(),date:bDate.value,weight:bWeight.value,fat:bFat.value,waist:bWaist.value});save();alert('已儲存')}
function renderHistory(){let s=hStart.value,e=hEnd.value,f=db.foods.filter(x=>x.date>=s&&x.date<=e),x=db.exercise.filter(x=>x.date>=s&&x.date<=e),days=[...new Set([...f.map(x=>x.date),...x.map(x=>x.date)])].sort().reverse();historyList.innerHTML=days.length?days.map(d=>`<div class="item"><b>${d}</b><div class="small">飲食 ${f.filter(x=>x.date===d).length} 筆・運動 ${x.filter(x=>x.date===d).reduce((a,b)=>a+num(b.minutes),0)} 分鐘</div></div>`).join(''):'<div class="empty">無資料</div>'}function printHistory(){let s=hStart.value,e=hEnd.value,f=db.foods.filter(x=>x.date>=s&&x.date<=e),x=db.exercise.filter(x=>x.date>=s&&x.date<=e);printContent.innerHTML=`<h3>${s}～${e}</h3><h4>飲食</h4>${f.map(v=>`<div>${v.date} ${esc(v.meal)} ${esc(v.food)} ${esc(v.kcal)} kcal</div>`).join('')}<h4>運動</h4>${x.map(v=>`<div>${v.date} ${esc(v.type)} ${esc(v.class)} ${esc(v.minutes)} 分鐘</div>`).join('')}`;window.print()}
function renderStats(){statFoods.textContent=db.foods.length;statDays.textContent=new Set(db.foods.map(x=>x.date)).size;statEx.textContent=Math.round(db.exercise.reduce((a,b)=>a+num(b.minutes),0));statBody.textContent=db.body.length;bodyList.innerHTML=[...db.body].sort((a,b)=>b.date.localeCompare(a.date)).map(x=>`<div class="item"><b>${x.date}</b><div class="small">體重 ${esc(x.weight||'—')} kg・體脂 ${esc(x.fat||'—')} %・腰圍 ${esc(x.waist||'—')} cm</div></div>`).join('')||'<div class="empty">尚無資料</div>'}
function renderReminder(){let f=db.foods.filter(x=>x.date===dn()),k=f.reduce((a,b)=>a+num(b.kcal),0),p=f.reduce((a,b)=>a+num(b.protein),0),g=num(db.settings.goalKcal),gp=num(db.settings.goalProtein),w=num(db.settings.warnPercent)||80,m=[];if(g){let q=k/g*100;m.push(q>=100?`今天約 ${Math.round(k)} kcal，已達設定目標。`:q>=w?`今天約 ${Math.round(k)} kcal，約為目標 ${Math.round(q)}%。`:`今天約 ${Math.round(k)} kcal，約為目標 ${Math.round(q)}%。`)}else m.push('尚未設定每日熱量目標。');if(gp)m.push(p>=gp?`蛋白質約 ${p.toFixed(1)} g，已達目標。`:`蛋白質約 ${p.toFixed(1)} g，距目標約 ${(gp-p).toFixed(1)} g。`);reminder.textContent=m.join(' ')}
function loadSettings(){goalKcal.value=db.settings.goalKcal;goalProtein.value=db.settings.goalProtein;warnPercent.value=db.settings.warnPercent;summaryTime.value=db.settings.summaryTime;lockMinutes.value=db.settings.lockMinutes}function saveSettings(){db.settings.goalKcal=goalKcal.value;db.settings.goalProtein=goalProtein.value;db.settings.warnPercent=warnPercent.value||'80';db.settings.summaryTime=summaryTime.value||'20:30';db.settings.lockMinutes=lockMinutes.value||'5';save();renderReminder();alert('已儲存')}
async function hashPin(v){let h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v));return [...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,'0')).join('')}async function setPin(){let v=newPin.value.trim();if(!/^\d{4,6}$/.test(v)){alert('請輸入 4～6 位數字');return}db.settings.pinHash=await hashPin(v);db.settings.lockMinutes=lockMinutes.value||'5';save();newPin.value='';alert('PIN 已啟用')}function disablePin(){db.settings.pinHash='';save();lock.classList.remove('show');alert('PIN 已停用')}async function unlockApp(){if(await hashPin(unlockPin.value)===db.settings.pinHash){lock.classList.remove('show');unlockPin.value=''}else alert('PIN 錯誤')}function forgotPin(){if(confirm('忘記 PIN 需要清除這個瀏覽器中的所有資料，確定嗎？')){localStorage.removeItem(K);indexedDB.deleteDatabase('foodphotos');location.reload()}}
document.addEventListener('visibilitychange',()=>{if(document.hidden){db.settings.lastHidden=Date.now();save()}else if(db.settings.pinHash&&Date.now()-(db.settings.lastHidden||0)>num(db.settings.lockMinutes)*60000)lock.classList.add('show')})
function exportBackup(){let b=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`飲食紀錄備份_${dn()}.json`;a.click()}function importBackup(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{db={...D,...JSON.parse(r.result),settings:{...D.settings,...(JSON.parse(r.result).settings||{})}};save();location.reload()}catch{alert('備份格式錯誤')}};r.readAsText(f)}
function init(){let d=dn();fDate.value=bDate.value=eDate.value=hStart.value=hEnd.value=mConfirmed.value=d;fTime.value=eStart.value=tn();autoClass();renderToday();renderExercise();renderStats();loadSettings();if(db.settings.pinHash)lock.classList.add('show')}if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));init();
</script></body></html>
